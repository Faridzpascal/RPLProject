<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Halaman Login Smart Plant Dashboard - Sistem Monitoring & Kontrol IoT Berbasis PHP & ESP32">
    <title>Login - Smart Plant Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-wrapper">

    <div class="login-card p-4 p-sm-5">
        
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <div class="login-brand-icon mb-3">
                <i class="bi bi-flower1"></i>
            </div>
            <h1 class="h3 fw-bold mb-1 text-success">Smart Plant</h1>
            <p class="text-muted small mb-0">Sistem Monitoring & Kontrol Penyiraman IoT</p>
        </div>

        <!-- Alert Pesan Error / Notifikasi -->
        <div id="loginAlert" class="alert alert-danger d-flex align-items-center mb-4 d-none" role="alert">
            <i class="bi bi-exclamation-circle-fill fs-5 me-2 flex-shrink-0" id="loginAlertIcon"></i>
            <div id="loginAlertText" class="small">
                Username atau password salah.
            </div>
        </div>

        <!-- Form Login -->
        <form id="loginForm" novalidate>
            <!-- Username Input -->
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small text-secondary">
                    <i class="bi bi-person me-1 text-success"></i> Username
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-person-fill text-muted"></i>
                    </span>
                    <input 
                        type="text" 
                        class="form-control form-control-lg border-start-0" 
                        id="username" 
                        name="username" 
                        placeholder="Contoh: admin" 
                        required 
                        autofocus 
                        autocomplete="username"
                    >
                </div>
            </div>

            <!-- Password Input -->
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold small text-secondary">
                    <i class="bi bi-shield-lock me-1 text-success"></i> Password
                </label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0">
                        <i class="bi bi-key-fill text-muted"></i>
                    </span>
                    <input 
                        type="password" 
                        class="form-control form-control-lg border-start-0 border-end-0" 
                        id="password" 
                        name="password" 
                        placeholder="Masukkan password" 
                        required 
                        autocomplete="current-password"
                    >
                    <button 
                        class="btn btn-outline-secondary border-start-0 bg-light text-muted" 
                        type="button" 
                        id="btnTogglePassword" 
                        title="Tampilkan / Sembunyikan Password"
                        tabindex="-1"
                    >
                        <i class="bi bi-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Tombol Submit Login -->
            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm mb-3" id="btnLogin">
                <span id="loginBtnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                <span id="loginBtnIcon"><i class="bi bi-box-arrow-in-right me-2"></i></span>
                <span id="loginBtnText">Masuk ke Dashboard</span>
            </button>
        </form>

        <!-- Kotak Info Kredensial Default untuk Pengujian -->
        <div class="demo-account-box p-3 mt-3">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="small fw-bold text-success">
                    <i class="bi bi-info-circle me-1"></i> Akun Pengujian Default
                </span>
                <button type="button" id="btnAutofillDemo" class="btn btn-xs btn-outline-success py-0 px-2 rounded-pill small" style="font-size: 0.75rem;">
                    Autofill
                </button>
            </div>
            <div class="small text-muted font-monospace">
                <div>Username: <strong class="text-dark">admin</strong></div>
                <div>Password: <strong class="text-dark">password123</strong></div>
            </div>
        </div>

        <!-- Footer Link -->
        <div class="text-center mt-4">
            <a href="../tests/index.html" class="text-decoration-none small text-muted">
                <i class="bi bi-shield-check me-1"></i> Buka Unit Test Runner
            </a>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Vanilla JS (Berisi handler login, session check, dsb) -->
    <script src="js/app.js"></script>
</body>
</html>
