<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Halaman Login Smart Plant Dashboard - Sistem Monitoring & Kontrol IoT Berbasis PHP & ESP32">
    <title>Login - Smart Plant Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Modern CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-wrapper">

    <div class="login-card">
        <div class="login-card-accent"></div>

        <div class="p-4 p-sm-5">
            <!-- Theme Toggle (top right) -->
            <div class="d-flex justify-content-end mb-2">
                <button type="button" id="btnThemeToggle" class="btn-icon-circle" title="Ganti Tema Gelap / Terang" aria-label="Ganti Tema">
                    <i class="bi bi-moon-stars" id="themeIcon"></i>
                </button>
            </div>

            <!-- Brand Header -->
            <div class="text-center mb-4">
                <div class="login-brand-icon mb-3">
                    <i class="bi bi-flower1"></i>
                </div>
                <h1 class="h3 fw-bold mb-1">Smart Plant</h1>
                <p class="text-muted small mb-0">IoT Soil Moisture &amp; Irrigation Control</p>
            </div>

            <!-- Alert Pesan Error / Notifikasi -->
            <div id="loginAlert" class="alert alert-danger d-flex align-items-center mb-4 rounded-3 d-none" role="alert">
                <i class="bi bi-exclamation-circle-fill fs-5 me-2 flex-shrink-0" id="loginAlertIcon"></i>
                <div id="loginAlertText" class="small">
                    Username atau password salah.
                </div>
            </div>

            <!-- Form Login -->
            <form id="loginForm" novalidate>
                <!-- Username Input -->
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold small text-secondary">
                        Username
                    </label>
                    <div class="input-group input-modern">
                        <span class="input-group-text border-end-0 rounded-start-3">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <input
                            type="text"
                            class="form-control form-control-lg border-start-0 rounded-end-3"
                            id="username"
                            name="username"
                            placeholder="Contoh: admin"
                            required
                            autofocus
                            autocomplete="username"
                        >
                    </div>
                </div>

                <!-- Password Input -->
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold small text-secondary">
                        Password
                    </label>
                    <div class="input-group input-modern">
                        <span class="input-group-text border-end-0 rounded-start-3">
                            <i class="bi bi-key-fill"></i>
                        </span>
                        <input
                            type="password"
                            class="form-control form-control-lg border-start-0 border-end-0"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            required
                            autocomplete="current-password"
                        >
                        <button
                            class="btn btn-outline-secondary border-start-0 rounded-end-3"
                            style="border-color: var(--border-color); background: var(--surface-subtle); color: var(--text-muted);"
                            type="button"
                            id="btnTogglePassword"
                            title="Tampilkan / Sembunyikan Password"
                            tabindex="-1"
                        >
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Tombol Submit Login -->
                <button type="submit" class="btn btn-pump-modern btn-pump-on btn-lg w-100 shadow-sm mb-3" id="btnLogin">
                    <span id="loginBtnSpinner" class="spinner-border spinner-border-sm me-2 d-none" role="status" aria-hidden="true"></span>
                    <span id="loginBtnIcon"><i class="bi bi-box-arrow-in-right me-2"></i></span>
                    <span id="loginBtnText">Masuk ke Dashboard</span>
                </button>
            </form>

            <!-- Footer Link -->
            <div class="text-center mt-4">
                <a href="../tests/index.html" class="text-decoration-none small text-muted">
                    <i class="bi bi-shield-check me-1"></i> Buka Unit Test Runner
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Vanilla JS -->
    <script src="js/app.js"></script>
</body>
</html>
